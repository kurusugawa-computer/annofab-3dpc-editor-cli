[project]
name = "annofab-3dpc-editor-cli"
dynamic = ["version"]
description = "Annofabの3次元プロジェクトを操作するためのCLIです。"
authors = [{ name = "Kurusugawa Computer Inc." }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Topic :: Utilities",
    "Operating System :: OS Independent",
]
dependencies = [
    "annofabapi>=1.3,<2",
    "dataclasses-json>=0.5.7,<1",
    "fire>=0.3.1,<1",
    "more-itertools>=8.5.0",
    "numpy>=1.23,<3",
    "scipy>=1.9.0,<2",
    "boto3>=1.17.20,<2",
    "botocore>=1.42.13,<2",
]

[project.urls]
Repository = "https://github.com/kurusugawa-computer/annofab-3dpc-editor-cli"

[project.scripts]
anno3d = "anno3d.app:main"

[dependency-groups]
linter = [
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
]
test = [
    "pytest>=9,<10",
]
documentation = [
    "sphinx>=9.1,<10; python_version >= '3.12'",
    "pydata-sphinx-theme>=0.21,<0.22",
    "types-requests>=2.33,<3",
    "myst-parser>=5.1,<6",
]
dev-only = [
    # Python 3.13用のwheelを利用するため、開発時のみ下限を引き上げる。
    "numpy>=2.1; python_version >= '3.13'",
    "scipy>=1.14.1; python_version >= '3.13'",
]

[tool.uv]
default-groups = ["linter", "test", "documentation", "dev-only"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["anno3d"]
