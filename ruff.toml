target-version = "py311"
line-length = 120

[lint]
select = [
    "E", # Error
    "F", # Pyflakes
    "W", # Warning
    "I", # isort
    "B",  # flake8-bugbear
    "NPY", # NumPy-specific rules
    "RUF", # Ruff-specific rules
    "FURB", # refurb
    "PL", # Pylint
]

ignore = [
    "RUF001", # 全角記号など`ambiguous unicode character`も使いたいため
    "RUF002",# 全角記号など`ambiguous unicode character`も使いたいため
    "RUF003",# 全角記号など`ambiguous unicode character`も使いたいため
    # 既存の Pylint 設定で無効化していたルール、および Pylint にはない
    # Ruff 固有の厳格なルールは、移行時の挙動を維持するため無効化する。
    "PLC2401", # テスト関数名に日本語を利用するため
    "PLC1802", # len(SEQUENCE) による空判定を許容するため
    "PLR0913", # コマンドに対応する関数では引数が多くなるため
    "PLR0917", # コマンドに対応する関数では位置引数が多くなるため
    "PLR0912", # 分岐数が多い関数を許容するため
    "PLR2004", # テストの期待値などのリテラル比較を許容するため
    "PLR5501", # return 後の else を許容するため
    "PLW0603", # global 文を許容するため
]
